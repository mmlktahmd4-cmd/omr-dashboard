<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>لوحة تحكم الراوتر</title>
<style>
:root{
  --bg:#0b1220; --card:#151d31; --card2:#1c2740; --line:#28324c;
  --txt:#e8edf7; --mut:#93a0bd; --accent:#3b82f6; --accent2:#2563eb;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#16244a 0%,var(--bg) 55%);
  color:var(--txt);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:18px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#22d3ee);
  display:grid;place-items:center;font-weight:800;font-size:20px;color:#04122b}
h1{font-size:19px;margin:0}
.sub{color:var(--mut);font-size:12px}
.refresh{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut);display:inline-block}
.dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.bad{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.dot.warn{background:var(--warn);box-shadow:0 0 10px var(--warn)}

/* Hero status */
.hero{background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:var(--radius);padding:20px;margin-bottom:16px;display:flex;align-items:center;
  justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero .state{display:flex;align-items:center;gap:14px}
.orb{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;flex:none}
.orb.ok{background:rgba(34,197,94,.15);color:var(--ok);box-shadow:0 0 0 4px rgba(34,197,94,.12)}
.orb.warn{background:rgba(245,158,11,.15);color:var(--warn);box-shadow:0 0 0 4px rgba(245,158,11,.12)}
.orb.bad{background:rgba(239,68,68,.15);color:var(--bad);box-shadow:0 0 0 4px rgba(239,68,68,.12)}
.hero h2{margin:0 0 3px;font-size:18px}
.hero p{margin:0;color:var(--mut);font-size:13px}
.btn{border:0;cursor:pointer;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:700;
  color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));display:inline-flex;
  align-items:center;gap:8px;transition:transform .06s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.big{padding:14px 22px;font-size:15px}
.btn.ghost{background:#1e2942;border:1px solid var(--line)}
.btn.warnb{background:linear-gradient(135deg,#f59e0b,#d97706)}
.btn:disabled{opacity:.55;cursor:default}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h3{margin:0 0 2px;font-size:15px;display:flex;align-items:center;gap:8px}
.card .meta{color:var(--mut);font-size:12px;margin:0 0 12px}
.rows{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;font-size:13px}
.row span:first-child{color:var(--mut)}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.pill.ok{background:rgba(34,197,94,.16);color:#4ade80}
.pill.bad{background:rgba(239,68,68,.16);color:#f87171}
.pill.warn{background:rgba(245,158,11,.16);color:#fbbf24}
.cardbtns{display:flex;gap:8px;flex-wrap:wrap}
.cardbtns .btn{padding:9px 12px;font-size:12.5px;flex:1;justify-content:center}

/* problems / advice */
.advice{margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.alert{border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.alert.bad{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3)}
.alert.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3)}
.alert.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.28)}
.alert b{display:block;margin-bottom:2px}
.alert .ico{font-size:16px;line-height:1.3}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:#1e2942;border:1px solid var(--line);color:var(--txt);padding:12px 18px;border-radius:12px;
  font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{margin-top:22px;text-align:center;color:var(--mut);font-size:11.5px;line-height:1.7}
a.link{color:#7dd3fc;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">OMR</div>
      <div>
        <h1 id="host">لوحة تحكم الراوتر</h1>
        <div class="sub" id="sub">جاري الاتصال…</div>
      </div>
    </div>
    <div class="refresh"><span class="dot" id="live"></span><span id="livetxt">تحديث تلقائي</span></div>
  </header>

  <div class="hero">
    <div class="state">
      <div class="orb warn" id="orb">…</div>
      <div>
        <h2 id="heroTitle">جاري الفحص…</h2>
        <p id="heroDesc">نفحص الوصلات والسيرفر</p>
      </div>
    </div>
    <button class="btn big" id="reconnect" onclick="doAction('reconnect','إعادة الاتصال بالكامل')">
      <span>🔄</span><span>توصيل / إعادة الاتصال</span>
    </button>
  </div>

  <div class="advice" id="advice"></div>

  <div class="grid" id="grid"></div>

  <div class="card" id="updcard" style="margin-top:16px">
    <h3><span class="dot ok"></span>التحديثات عبر GitHub</h3>
    <div class="meta">الإصدار الحالي: <b id="curVer">—</b> · آخر إصدار: <span id="remoteVer">اضغط «تحقق»</span></div>
    <div class="cardbtns" style="max-width:420px">
      <button class="btn ghost" onclick="checkUpdate()">تحقق من التحديثات</button>
      <button class="btn" id="btnUpdate" style="display:none" onclick="doUpdate()">تحديث الآن</button>
    </div>
  </div>

  <div class="foot">
    الواجهة تعمل داخل الراوتر · للإعدادات المتقدمة افتح
    <a class="link" href="/cgi-bin/luci" target="_blank">اللوحة الأصلية (LuCI)</a><br>
    <span id="exitwrap">عنوان الخروج للإنترنت: <a class="link" href="#" onclick="checkExit();return false" id="exitlink">فحص الآن</a></span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let busy=false, timer=null;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600);}

async function api(a,i){
  const u='/cgi-bin/omr-api?a='+encodeURIComponent(a)+(i?'&i='+encodeURIComponent(i):'');
  const r=await fetch(u,{cache:'no-store'});
  return r.json();
}

async function load(){
  try{
    const d=await api('status');
    render(d);
    $('#live').className='dot ok';
    $('#livetxt').textContent='محدّث الآن';
  }catch(e){
    $('#live').className='dot bad';
    $('#livetxt').textContent='تعذّر الاتصال بالراوتر';
  }
}

function pill(ok,okT,badT,warn){
  if(ok) return '<span class="pill ok">'+okT+'</span>';
  if(warn) return '<span class="pill warn">'+badT+'</span>';
  return '<span class="pill bad">'+badT+'</span>';
}

function render(d){
  $('#host').textContent = d.host || 'لوحة تحكم الراوتر';
  $('#sub').textContent = 'السيرفر: '+(d.vps?.host||'-')+(d.version?' · إصدار '+d.version:'');
  if(d.version) $('#curVer').textContent = d.version;

  // WAN cards
  let cards='';
  const wanUp = (d.wans||[]).filter(w=>w.net).length;
  (d.wans||[]).forEach((w,idx)=>{
    const label = 'الوصلة '+(idx+1)+' ('+w.name+')';
    let cls='bad', txt='غير متصلة';
    if(w.net){cls='ok';txt='متصلة بالإنترنت';}
    else if(w.link){cls='warn';txt='الكيبل متصل، بلا إنترنت';}
    else if(w.up){cls='warn';txt='مفعّلة، بلا كيبل';}
    cards += `<div class="card">
      <h3><span class="dot ${cls}"></span>${label}</h3>
      <div class="meta">${w.dev||'-'} · ${w.proto||''}</div>
      <div class="rows">
        <div class="row"><span>الحالة</span>${pill(w.net,'إنترنت',txt,w.link||w.up)}</div>
        <div class="row"><span>عنوان IP</span><span>${w.ip||'—'}</span></div>
        <div class="row"><span>الكيبل</span><span>${w.link?('نعم'+(w.speed?' · '+w.speed+'Mb':'')):'لا يوجد'}</span></div>
        <div class="row"><span>زمن الاستجابة</span><span>${w.lat?w.lat+' ms':'—'}</span></div>
      </div>
      <div class="cardbtns">
        <button class="btn" onclick="doAction('wanup','تشغيل ${w.name}','${w.name}')">تشغيل</button>
        <button class="btn ghost" onclick="doAction('wanrestart','إعادة تشغيل ${w.name}','${w.name}')">إعادة</button>
        <button class="btn ghost" onclick="doAction('wandown','إيقاف ${w.name}','${w.name}')">إيقاف</button>
      </div>
    </div>`;
  });

  // VPS card
  const v=d.vps||{}, t=d.tunnel||{}, p=d.proxy||{};
  cards += `<div class="card">
    <h3><span class="dot ${v.reachable?'ok':'bad'}"></span>السيرفر البعيد (VPS)</h3>
    <div class="meta">${v.host||'-'}</div>
    <div class="rows">
      <div class="row"><span>الوصول للسيرفر</span>${pill(v.reachable,'يعمل','لا يصل')}</div>
      <div class="row"><span>زمن الاستجابة</span><span>${v.lat?v.lat+' ms':'—'}</span></div>
    </div></div>`;

  // Tunnel card
  cards += `<div class="card">
    <h3><span class="dot ${t.up?'ok':'bad'}"></span>النفق المشفّر (VPN)</h3>
    <div class="meta">${t.dev||'tun0'} → ${t.peer||''}</div>
    <div class="rows">
      <div class="row"><span>حالة النفق</span>${pill(t.up,'يعمل','متوقف',t.service)}</div>
      <div class="row"><span>زمن الاستجابة</span><span>${t.lat?t.lat+' ms':'—'}</span></div>
    </div>
    <div class="cardbtns">
      <button class="btn" onclick="doAction('vpn','إعادة تشغيل النفق')">إعادة تشغيل النفق</button>
    </div></div>`;

  // Proxy card
  cards += `<div class="card">
    <h3><span class="dot ${p.running?'ok':'bad'}"></span>موجّه البيانات (Proxy)</h3>
    <div class="meta">${p.name||''}</div>
    <div class="rows">
      <div class="row"><span>الحالة</span>${pill(p.running,'يعمل','متوقف')}</div>
    </div>
    <div class="cardbtns">
      <button class="btn" onclick="doAction('proxy','إعادة تشغيل الموجّه')">إعادة التشغيل</button>
    </div></div>`;

  $('#grid').innerHTML=cards;

  // Overall health + advice
  const problems=[];
  if(!v.reachable) problems.push({lvl:'bad',t:'السيرفر البعيد لا يستجيب',d:'تأكد أن السيرفر يعمل وأن هناك وصلة إنترنت واحدة على الأقل تعمل. جرّب زر «توصيل / إعادة الاتصال».'});
  if(v.reachable && !t.up) problems.push({lvl:'bad',t:'النفق المشفّر متوقف',d:'السيرفر يصل لكن النفق مغلق. اضغط «إعادة تشغيل النفق».'});
  if(t.up && !p.running) problems.push({lvl:'warn',t:'موجّه البيانات متوقف',d:'اضغط «إعادة التشغيل» في بطاقة الموجّه.'});
  (d.wans||[]).forEach((w,idx)=>{
    if(!w.link && !w.up) problems.push({lvl:'warn',t:'الوصلة '+(idx+1)+' غير موصولة',d:'وصّل كيبل الشبكة/الـUSB وتأكد من المنفذ.'});
    else if(w.link && !w.net) problems.push({lvl:'warn',t:'الوصلة '+(idx+1)+' بلا إنترنت',d:'الكيبل متصل لكن لا يوجد إنترنت من المصدر. جرّب «إعادة» على هذه الوصلة.'});
  });

  const healthy = v.reachable && t.up && p.running && wanUp>=1;
  const orb=$('#orb');
  if(healthy){
    orb.className='orb ok';orb.textContent='✓';
    $('#heroTitle').textContent='كل شيء يعمل';
    $('#heroDesc').textContent=wanUp+' وصلة متصلة · النفق والسيرفر يعملان';
  } else if(problems.some(x=>x.lvl==='bad')){
    orb.className='orb bad';orb.textContent='!';
    $('#heroTitle').textContent='يوجد مشكلة في الاتصال';
    $('#heroDesc').textContent='راجع التنبيهات بالأسفل أو اضغط إعادة الاتصال';
  } else {
    orb.className='orb warn';orb.textContent='!';
    $('#heroTitle').textContent='يعمل مع ملاحظات';
    $('#heroDesc').textContent='الاتصال الأساسي يعمل، لكن هناك تحسينات ممكنة';
  }

  let adv='';
  if(problems.length===0){
    adv=`<div class="alert ok"><span class="ico">✓</span><div><b>لا توجد مشاكل</b>النظام يعمل بشكل سليم.</div></div>`;
  } else {
    problems.forEach(pr=>{
      adv+=`<div class="alert ${pr.lvl}"><span class="ico">${pr.lvl==='bad'?'⛔':'⚠️'}</span><div><b>${pr.t}</b>${pr.d}</div></div>`;
    });
  }
  $('#advice').innerHTML=adv;
}

async function doAction(a,label,i){
  if(busy) return;
  busy=true;
  const btns=document.querySelectorAll('.btn');
  const clicked=event&&event.currentTarget;
  let old='';
  if(clicked){old=clicked.innerHTML;clicked.innerHTML='<span class="spin"></span><span>جاري…</span>';}
  btns.forEach(b=>b.disabled=true);
  try{
    await api(a,i);
    toast('تم: '+label+' — جاري التحديث');
    setTimeout(load, a==='wanup'||a==='wandown' ? 2500 : 6000);
  }catch(e){ toast('فشل تنفيذ: '+label); }
  setTimeout(()=>{
    busy=false;
    document.querySelectorAll('.btn').forEach(b=>b.disabled=false);
    if(clicked) clicked.innerHTML=old;
  }, a==='wanup'||a==='wandown' ? 2600 : 6200);
}

async function checkUpdate(){
  $('#remoteVer').textContent='جاري الفحص…';
  try{
    const d=await api('version');
    $('#curVer').textContent=d.local||'—';
    $('#remoteVer').textContent=d.remote||'غير معروف';
    if(d.remote && d.local && d.remote!==d.local){
      $('#btnUpdate').style.display='';
      toast('يتوفر تحديث جديد: '+d.remote);
    } else {
      $('#btnUpdate').style.display='none';
      if(d.remote) toast('أنت على أحدث إصدار');
    }
  }catch(e){ $('#remoteVer').textContent='فشل الفحص (تأكد من الإنترنت)'; }
}

async function doUpdate(){
  if(busy) return; busy=true;
  const b=$('#btnUpdate'); const old=b.innerHTML;
  b.innerHTML='<span class="spin"></span><span>جاري التحديث…</span>';
  document.querySelectorAll('.btn').forEach(x=>x.disabled=true);
  try{
    const d=await api('update');
    toast('تم التحديث إلى '+(d.version||'')+' — إعادة تحميل');
    setTimeout(()=>location.reload(), 2800);
  }catch(e){
    toast('فشل التحديث');
    b.innerHTML=old; busy=false;
    document.querySelectorAll('.btn').forEach(x=>x.disabled=false);
  }
}

async function checkExit(){
  $('#exitlink').textContent='جاري الفحص…';
  try{
    const d=await api('exitip');
    $('#exitwrap').innerHTML='عنوان الخروج للإنترنت: <b>'+(d.exit_ip||'غير معروف')+'</b>';
  }catch(e){ $('#exitlink').textContent='فشل الفحص، حاول مجدداً'; }
}

load();
timer=setInterval(load,7000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
</script>
</body>
</html>
